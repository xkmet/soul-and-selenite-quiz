  :root {
    --pearl: #E9E2D6; --surface: #F5F1E9; --card: #FFFFFF;
    --ink: #625C56; --ink-strong: #3D3A36;
    --sage: #77835E; --pink: #DDB9BB; --line: #D8CFBE;
    --shadow: 0 1px 2px rgba(61,58,54,0.05), 0 8px 24px rgba(61,58,54,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --pearl:#221F1C; --surface:#2B2724; --card:#322E2A; --ink:#C9C2BA; --ink-strong:#ECE5DE; --sage:#98A37E; --pink:#E4C3C5; --line:#423D38; --shadow:0 1px 2px rgba(0,0,0,0.3),0 8px 24px rgba(0,0,0,0.3); }
  }
  :root[data-theme="dark"] { --pearl:#221F1C; --surface:#2B2724; --card:#322E2A; --ink:#C9C2BA; --ink-strong:#ECE5DE; --sage:#98A37E; --pink:#E4C3C5; --line:#423D38; --shadow:0 1px 2px rgba(0,0,0,0.3),0 8px 24px rgba(0,0,0,0.3); }
  :root[data-theme="light"] { --pearl:#E9E2D6; --surface:#F5F1E9; --card:#FFFFFF; --ink:#625C56; --ink-strong:#3D3A36; --sage:#77835E; --pink:#DDB9BB; --line:#D8CFBE; --shadow:0 1px 2px rgba(61,58,54,0.05),0 8px 24px rgba(61,58,54,0.06); }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--pearl); color: var(--ink-strong); font-family: 'Jost','Century Gothic',sans-serif; font-weight: 300; -webkit-font-smoothing: antialiased; }
  body { display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem; }
  .stage { width: 100%; max-width: 480px; transition: max-width 0.2s ease; }
  .stage.wide { max-width: 640px; }

  .brandbar { display: flex; align-items: center; gap: 0.6rem; justify-content: center; margin-bottom: 2rem; }
  .brandbar svg { width: 22px; height: 28px; }
  .brandbar span { text-transform: uppercase; letter-spacing: 0.16em; font-size: 0.85rem; }
  .brandbar em { font-style: normal; color: var(--sage); }

  .card { background: var(--card); border: 1px solid var(--pink); border-radius: 10px; box-shadow: var(--shadow); padding: 2.4rem 2rem; min-height: 340px; display: flex; flex-direction: column; }
  .progress { display: flex; gap: 0.35rem; margin-bottom: 1.6rem; }
  .progress i { flex: 1; height: 3px; border-radius: 2px; background: var(--line); }
  .progress i.on { background: var(--sage); }

  .eyebrow { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sage); margin: 0 0 0.7rem; }
  h1.q { font-size: 1.35rem; font-weight: 400; line-height: 1.35; margin: 0 0 1.6rem; text-wrap: balance; }

  .options { display: flex; flex-direction: column; gap: 0.6rem; flex: 1; }
  .opt { text-align: left; font-family: inherit; font-weight: 300; font-size: 0.98rem; color: var(--ink-strong); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0.85rem 1.1rem; cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease; }
  .opt:hover { border-color: var(--sage); background: var(--card); }
  .opt:focus-visible { outline: 2px solid var(--sage); outline-offset: 2px; }

  .backrow { margin-top: 1.4rem; }
  .backlink { background: none; border: none; font-family: inherit; font-size: 0.8rem; color: var(--ink); opacity: 0.6; cursor: pointer; padding: 0; }
  .backlink:hover { opacity: 1; }

  /* "other" free-text option */
  .other-wrap { margin-top: 1rem; }
  .other-divider { display: flex; align-items: center; gap: 0.7rem; margin: 0.2rem 0 0.8rem; font-size: 0.75rem; opacity: 0.5; }
  .other-divider::before, .other-divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .other-row { display: flex; gap: 0.5rem; }
  .other-row input { flex: 1; min-width: 0; font-family: inherit; font-weight: 300; font-size: 0.92rem; color: var(--ink-strong); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0.75rem 0.9rem; }
  .other-row input:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }
  .other-row button { flex-shrink: 0; font-family: inherit; font-weight: 300; font-size: 0.85rem; color: var(--pearl); background: var(--sage); border: none; border-radius: 8px; padding: 0 1.1rem; cursor: pointer; }
  .other-note { font-size: 0.72rem; opacity: 0.45; margin: 0.5rem 0 0; }

  /* contact form */
  .field { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
  .field label { font-size: 0.78rem; opacity: 0.7; }
  .field input { font-family: inherit; font-weight: 300; font-size: 0.98rem; color: var(--ink-strong); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0.75rem 1rem; }
  .field input:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; }
  .submit-btn { font-family: inherit; font-weight: 300; font-size: 0.95rem; color: var(--pearl); background: var(--ink-strong); border: none; border-radius: 8px; padding: 0.85rem 1.1rem; cursor: pointer; margin-top: 0.4rem; }

  /* result */
  .result { text-align: center; }
  .result .tag { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sage); margin: 0.4rem 0 1.2rem; }
  .crystal-icon { width: 56px; height: 56px; margin: 0 auto 1rem; display: block; }
  .result h2 { font-size: 2rem; font-weight: 400; margin: 0 0 0.7rem; }
  .result p.chakra { font-size: 0.95rem; line-height: 1.6; opacity: 0.85; max-width: 34ch; margin: 0 auto 1.7rem; }
  .cta { display: inline-block; font-family: inherit; font-size: 0.85rem; padding: 0.8rem 1.7rem; border-radius: 999px; background: var(--ink-strong); color: var(--pearl); text-decoration: none; border: none; cursor: pointer; }
  .retake { display: block; margin: 1.3rem auto 0; background: none; border: none; font-family: inherit; font-size: 0.78rem; color: var(--ink); opacity: 0.55; cursor: pointer; }
  .retake:hover { opacity: 1; }

  /* full reading */
  .reading .lede { display: flex; align-items: center; gap: 1.2rem; padding-bottom: 1.6rem; border-bottom: 1px solid var(--line); margin-bottom: 1.6rem; }
  .reading .lede .crystal-icon { width: 52px; height: 52px; margin: 0; flex-shrink: 0; }
  .reading .lede h2 { font-size: 1.6rem; font-weight: 400; margin: 0 0 0.3rem; }
  .reading .lede p { font-size: 0.85rem; opacity: 0.7; margin: 0; }
  .reading .demo-note { font-size: 0.75rem; opacity: 0.55; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 0.6rem 0.9rem; margin-bottom: 1.6rem; line-height: 1.5; }
  .reading h3 { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--sage); margin: 1.6rem 0 0.6rem; }
  .reading h3:first-of-type { margin-top: 0; }
  .reading p.body-text { font-size: 0.92rem; line-height: 1.65; margin: 0; opacity: 0.9; }
  .support-row { display: flex; gap: 0.8rem; flex-wrap: wrap; }
  .support-item { display: flex; align-items: center; gap: 0.5rem; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 0.35rem 0.9rem 0.35rem 0.4rem; font-size: 0.82rem; }
  .support-item .mini-icon { width: 18px; height: 18px; }
  .pose-list { display: flex; flex-direction: column; gap: 0.7rem; }
  .pose-item { font-size: 0.9rem; line-height: 1.55; }
  .pose-item b { font-weight: 400; color: var(--ink-strong); }
  .pose-item span { opacity: 0.75; }
  .affirmation { font-size: 1.05rem; font-style: normal; text-align: center; padding: 1rem 0.5rem; color: var(--ink-strong); }
  .reading .backrow { margin-top: 2rem; padding-top: 1.4rem; border-top: 1px solid var(--line); }

  @media (prefers-reduced-motion: no-preference) {
    .card { animation: fadein 0.25s ease; }
    @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  }
</style>

function classify(text, keywordMap) {
  const t = text.toLowerCase();
  const keys = Object.keys(keywordMap);
  let best = keys[0], bestScore = -1;
  for (const key of keys) {
    let score = 0;
    for (const pattern of keywordMap[key]) {
      try { if (new RegExp(pattern).test(t)) score++; } catch (e) {}
    }
    if (score > bestScore) { bestScore = score; best = key; }
  }
  return best;
}

    <p class="eyebrow">Step 2 of 6</p>
    <h1 class="q">How are you feeling today?</h1>
    <div class="options">${opts.map(o => `<button class="opt" data-c="${o.chakra}">${o.label}</button>`).join('')}</div>
    ${otherBoxHTML("e.g. \"stressed about money\"")}
    <div class="backrow"><button class="backlink" id="back">← back</button></div>`;
  card.querySelectorAll('.opt').forEach(b => b.onclick = () => { state.chakra = b.dataset.c; render(); });
  wireOtherBox(text => { state.chakra = classify(text, CHAKRA_KEYWORDS); render(); });
  document.getElementById('back').onclick = () => { state.polarity = null; render(); };
}

function renderStatement(card) {
  const opts = STATEMENTS[state.polarity][state.chakra];
  card.innerHTML = `
    ${progressDots(3)}
    <p class="eyebrow">Step 3 of 6</p>
    <h1 class="q">Which of these feels closest to what's going on?</h1>
    <div class="options">${opts.map(o => `<button class="opt" data-x="${o[1]}">${o[0]}</button>`).join('')}</div>
    ${otherBoxHTML("Describe your situation")}
    <div class="backrow"><button class="backlink" id="back">← back</button></div>`;
  card.querySelectorAll('.opt').forEach(b => b.onclick = () => { state.crystal = b.dataset.x; render(); });
  wireOtherBox(text => { state.crystal = classify(text, CRYSTAL_KEYWORDS[state.chakra]); render(); });
  document.getElementById('back').onclick = () => { state.chakra = null; render(); };
}

function renderDuration(card) {
  card.innerHTML = `
    ${progressDots(4)}
    <p class="eyebrow">Step 4 of 6</p>
    <h1 class="q">How long has this been sitting with you?</h1>
    <div class="options">
      <button class="opt" data-d="today">Just today</button>
      <button class="opt" data-d="weeks">A few weeks</button>
      <button class="opt" data-d="months">Months, or longer</button>
    </div>
    <div class="backrow"><button class="backlink" id="back">← back</button></div>`;
  card.querySelectorAll('.opt').forEach(b => b.onclick = () => { state.duration = b.dataset.d; render(); });
  document.getElementById('back').onclick = () => { state.crystal = null; render(); };
}

function renderYoga(card) {
  card.innerHTML = `
    ${progressDots(5)}
    <p class="eyebrow">Step 5 of 6</p>
    <h1 class="q">New to yoga, or do you have a regular practice?</h1>
    <div class="options">
      <button class="opt" data-y="new">New to it</button>
      <button class="opt" data-y="some">Some experience</button>
      <button class="opt" data-y="experienced">Very experienced</button>
    </div>
    <div class="backrow"><button class="backlink" id="back">← back</button></div>`;
  card.querySelectorAll('.opt').forEach(b => b.onclick = () => { state.yoga = b.dataset.y; render(); });
  document.getElementById('back').onclick = () => { state.duration = null; render(); };
}

function renderContact(card) {
  card.innerHTML = `
    ${progressDots(6)}
    <p class="eyebrow">Step 6 of 6</p>
    <h1 class="q">Where should we send your reading?</h1>
    <div class="field"><label for="fName">First name</label><input id="fName" type="text" value="${state.name}" placeholder="Optional"></div>
    <div class="field"><label for="fEmail">Email</label><input id="fEmail" type="email" value="${state.email}" placeholder="you@email.com"></div>
    <button class="submit-btn" id="reveal">Reveal my crystal</button>
    <div class="backrow"><button class="backlink" id="back">← back</button></div>`;
  document.getElementById('reveal').onclick = () => {
    state.name = document.getElementById('fName').value.trim();
    state.email = document.getElementById('fEmail').value.trim();
    state.contactDone = true;
    sendReadingEmail();
    render();
  };
  document.getElementById('back').onclick = () => { state.yoga = null; render(); };
}

function resetState() {
  state = { polarity: null, chakra: null, crystal: null, duration: null, yoga: null, name: '', email: '', contactDone: false, reading: false };
}

function renderResult(card) {
  const greeting = state.name ? `${state.name}, your crystal` : "Your crystal";
  card.innerHTML = `
    <div class="result">
      <p class="tag">${greeting}</p>
      ${crystalIconSVG(state.crystal, 'crystal-icon')}
      <h2>${state.crystal}</h2>
      <p class="chakra">${CHAKRA_LINE[state.chakra]}</p>
      <button class="cta" id="seeReading">See your full reading</button>
      <button class="retake" id="retake">Take the quiz again</button>
    </div>`;
  document.getElementById('retake').onclick = () => { resetState(); render(); };
  document.getElementById('seeReading').onclick = () => { state.reading = true; render(); };
}

function renderReading(card) {
  const r = READING[state.chakra];
  const supportHTML = r.supporting.map(s =>
    `<div class="support-item">${crystalIconSVG(s[0], 'mini-icon')}<span>${s[0]} — ${s[1]}</span></div>`
  ).join('');
  const title = state.name ? `${state.name}'s full reading` : "Your full reading";
  card.innerHTML = `
    <div class="reading">
      <div class="lede">
        ${crystalIconSVG(state.crystal, 'crystal-icon')}
        <div><h2>${state.crystal}</h2><p>${title}</p></div>
      </div>
      <div class="demo-note">This is what unlocks after the £6.99 report — showing it directly here for now since payment isn't connected yet.</div>
      <h3>Your Crystal</h3>
      <p class="body-text">${CRYSTAL_BLURB[state.crystal]}</p>
      <h3>Your Chakra</h3>
      <p class="body-text">${r.paragraph}</p>
      <p class="body-text">${DURATION_NOTE[state.duration]}</p>
      ${r.supporting.length ? `<h3>Supporting Crystals</h3><div class="support-row">${supportHTML}</div>` : ''}
      <h3>How To Use It</h3>
      <p class="body-text">${GENERIC_USE_TIP}</p>
      <h3>Your Practice</h3>
      <p class="body-text">${YOGA_INTRO[state.yoga]}</p>
      <div class="pose-list">${r.poses.map(p => `<div class="pose-item"><b>${p[0]}</b> — <span>${p[1]}</span></div>`).join('')}</div>
      <h3>Affirmation</h3>
      <p class="affirmation">"${r.affirmation}"</p>
      <div class="backrow"><button class="backlink" id="backResult">← back to your result</button></div>
    </div>`;
  document.getElementById('backResult').onclick = () => { state.reading = false; render(); };
}

render();
</script>
